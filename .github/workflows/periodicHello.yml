name: Periodic Hello

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
      timezone: Europe/Helsinki

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fullstackopen-ci-cd-wul9.onrender.com/