name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize, closed]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-node@v6
          with:
            node-version: '24'

        - name: Install dependencies
          run: npm install

        - name: Check style
          run: npm run eslint

        - name: Run npm test
          run: npm test

        - name: npm run build
          run: npm run build

        - name: Install Playwright Browsers
          run: npx playwright install --with-deps

        - name: Run Playwright tests
          run: npm run test:e2e
          
        - name: Trigger deployment
          if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip') }}
          run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  tag_release:
    if: ${{ github.event.pull_request.merged == true && !contains(github.event.pull_request.title, '#skip') }}
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0
    
    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: patch
  
  discord_notification:
    if: ${{ always() && github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip') }}
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest

    steps:
      - name: Send a message to Discord
        uses: sarisia/actions-status-discord@v1
        if: ${{ needs.simple_deployment_pipeline.result == 'success' }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          notimestamp: true
          title: 'Deployment Details'
          description: |
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Author: ${{ github.event.head_commit.author.name }}

      - name: Send a message to Discord
        uses: sarisia/actions-status-discord@v1
        if: ${{ needs.simple_deployment_pipeline.result == 'failure' }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: 'Failure Details'
          description: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.head_ref }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Author: ${{ github.event.head_commit.author.name }}
            Workflow: ${{ github.workflow }}
            Job: ${{ github.job }}